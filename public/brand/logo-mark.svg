<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Heat Priority Engine">
  <title>Heat Priority Engine</title>
  <!-- Two separate analytical axes (exposure, anomaly), a transit line with
       stops, one prioritised stop ringed by a thermal contour. The axes never
       touch: the geometry encodes "never blended". Colours are the validated
       project tokens: heat-500 #dd6b2c, brand-600 #17627f, ink-900 #10151c. -->
  <rect x="6" y="6" width="4" height="15" rx="1.2" fill="#dd6b2c"/>
  <rect x="13" y="11" width="4" height="10" rx="1.2" fill="#17627f"/>
  <path d="M3 25.5h26" stroke="#10151c" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="8" cy="25.5" r="1.7" fill="#ffffff" stroke="#10151c" stroke-width="1.1"/>
  <circle cx="15" cy="25.5" r="1.7" fill="#ffffff" stroke="#10151c" stroke-width="1.1"/>
  <circle cx="24.5" cy="25.5" r="4.6" fill="none" stroke="#dd6b2c" stroke-width="1.3"/>
  <circle cx="24.5" cy="25.5" r="2.4" fill="#10151c"/>
</svg>
